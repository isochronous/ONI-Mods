title: "Fridge Thresholds Extended"
description: "Makes the High and Low threshold sliders from Storage Refrigerator Thresholds work on the Mini Fridge, the Freezer, the fridges from Ronivan's Legacy - Industrial Revolution and the Storage Pod Redux Cool Pod: their automation port turns green and red at the thresholds you set. Requires Storage Refrigerator Thresholds."
