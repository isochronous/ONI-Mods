title: "Fridge Thresholds Extended"
description: "Makes the High and Low threshold sliders from Storage Refrigerator Thresholds work on the Mini Fridge, the Mini Freezer, the Freezer, the fridges from Ronivan's Legacy - Industrial Revolution and the Storage Pod Redux Cool Pod: their automation port turns green and red at the thresholds you set. Smart Storage Lockers follow their thresholds right after a save loads. Requires Storage Refrigerator Thresholds."
staticID: "Isochronous.FridgeThresholdsExtended"
