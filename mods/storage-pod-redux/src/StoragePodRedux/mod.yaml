title: "Storage Pod Redux"
description: "Two compact 1x1 storage buildings that can be built anywhere, including inside rockets: the Storage Pod (5 t of solids, no power) and the Cool Pod (a 50 kg powered fridge). A rewrite of Skyrunner's Storage Pod that works on current builds; each pod can be turned off in the options."
staticID: "Isochronous.StoragePodRedux"
