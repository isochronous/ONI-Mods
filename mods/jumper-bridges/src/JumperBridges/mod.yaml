title: "Jumper Bridges"
description: "An automation or power bridge can be placed with either end directly on a building's port, and that port counts as connected: the bridge end acts as its own piece of wire, drawn like one, with nothing to build, deconstruct or pay for. Bridges can be daisy-chained, end on end. A wire dragged up to a bridge end joins it as it would join a wire. Bridges whose ends sit on real wires work exactly as before."
staticID: "Isochronous.JumperBridges"
