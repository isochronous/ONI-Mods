name: Label issues by mod

# Issue forms cannot set a label from a dropdown, so this reads the form's "Mod" answer and labels
# the issue with that mod's folder name (an edit that changes the answer moves the label).
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = {
              "A new mod": "new-mod",
              "Bitshifter": "bitshifter",
              "Corner Build Anything": "corner-build-anything",
              "Detect Any Element": "detect-any-element",
              "Don't Count Eggs on Rails": "dont-count-eggs-on-rails",
              "Jumper Bridges": "jumper-bridges",
              "Just Fall Already!": "just-fall-already",
              "Motion Sensor Range": "motion-sensor-range",
              "Multichannel Critter Sensor": "multichannel-critter-sensor",
              "Natural Backwalls Everywhere": "natural-backwalls-everywhere",
              "No Magic Fridges": "no-magic-fridges",
              "Refined Building": "refined-building",
              "Salty Surf": "salty-surf",
              "Smart Weight Plate": "smart-weight-plate",
              "Storage Pod Redux": "storage-pod-redux",
              "Sweep Zones Redux": "sweep-zones",
              "Upgrade Planner": "upgrade-planner",
              "Vent Freeze Fix": "vent-freeze-fix",
            };
            const issue = context.payload.issue;
            // An issue form renders each answer under its label as "### Mod".
            const match = (issue.body || "").match(/^### Mod\s*\r?\n\s*\r?\n(.+?)\s*$/m);
            const wanted = match ? labels[match[1].trim()] : undefined;
            if (!wanted) return;
            const modLabels = new Set(Object.values(labels));
            const current = issue.labels.map(l => l.name);
            for (const name of current)
              if (modLabels.has(name) && name !== wanted)
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name });
            if (!current.includes(wanted))
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [wanted] });
